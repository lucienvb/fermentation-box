; PlatformIO Project Configuration File
;
; fermentatiebox: ESP32-CAM (AI-Thinker) + DHT22 temperature/humidity logger.
; F0: no camera, no SD card, no web page yet (see docs/behuizing.md and
; NOTES.md). Versions pinned the same as the home-monitor project.

[platformio]
; Only build esp32cam with `pio run` without -e. The native env is for
; `pio test -e native` (standalone unittest of the retention policy, see
; retention.h/.cpp); it has no main() and cannot run with `pio run`.
default_envs = esp32cam

[env:esp32cam]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
lib_deps =
  adafruit/DHT sensor library@1.4.7
  adafruit/Adafruit Unified Sensor@1.1.15

; Wireless upload (ArduinoOTA) instead of USB, see NOTES.md. Same source
; and settings as [env:esp32cam]; only the upload mechanism differs. The
; mDNS/OTA hostname is "fermentatiebox". The OTA password
; (OTA_PASSWORD in include/secrets.h) is NOT hardcoded here:
; ${sysenv.OTA_PASSWORD} reads it from the OTA_PASSWORD environment
; variable. Example: OTA_PASSWORD=your-password pio run -e esp32cam_ota -t upload
[env:esp32cam_ota]
extends = env:esp32cam
upload_protocol = espota
upload_port = fermentatiebox.local
upload_flags =
  --auth=${sysenv.OTA_PASSWORD}

; Native test environment for pure logic without Arduino dependencies,
; testable on its own with `pio test -e native`: the retention policy
; (retention.h/.cpp), the SD card path functions (paths.h/.cpp), the photo
; schedule (photo_schedule.h/.cpp), the test-photo gate (camera_gate.h/
; .cpp, F2b - depends on photo_schedule.h only), the flash brightness
; percent-to-duty math (flash_duty.h/.cpp, F2c) and the hourly status line
; formatting (status_line.h/.cpp, F2d).
[env:native]
platform = native
build_flags = -std=gnu++17
build_src_filter = +<retention.cpp> +<paths.cpp> +<photo_schedule.cpp> +<camera_gate.cpp> +<flash_duty.cpp> +<status_line.cpp>
test_build_src = yes
